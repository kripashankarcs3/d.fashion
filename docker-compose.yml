services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      CLIENT_ORIGIN: http://localhost:3001
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      MONGODB_URI: mongodb://mongo:27017/deestyle
      YOUCAM_API_KEY: ${YOUCAM_API_KEY}
      YOUCAM_API_SECRET: ${YOUCAM_API_SECRET}
    depends_on:
      - mongo

volumes:
  mongo-data:
