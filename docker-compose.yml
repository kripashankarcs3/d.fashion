services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      CLIENT_ORIGIN: http://localhost:3001
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      MONGODB_URI: mongodb://mongo:27017/deestyle
      YOUCAM_API_KEY: ${YOUCAM_API_KEY}
      # AI stylist: the container runs its own `opencode serve` on loopback
      # (server mode) using OPENCODE_AUTH_B64 — base64 of the machine's
      # ~/.local/share/opencode/auth.json. Set both in the root .env.
      OPENCODE_MODE: ${OPENCODE_MODE:-server}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-big-pickle}
      OPENCODE_SERVER_URL: http://127.0.0.1:4096
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      OPENCODE_AUTH_B64: ${OPENCODE_AUTH_B64:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      # Manual-payment review: who can approve/reject at /admin/payments, and
      # (optional) who gets emailed the moment a member submits one.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      - mongo

volumes:
  mongo-data:
