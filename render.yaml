services:
  - type: web
    name: d-fashion-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      # Frontend origin (Vercel URL) allowed by CORS — set in dashboard.
      - key: CLIENT_ORIGIN
        sync: false
      # Secrets — set in the Render dashboard, never committed.
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: YOUCAM_API_KEY
        sync: false
      # AI stylist chat via OpenRouter's free tier — a plain outbound HTTPS
      # call, no background process, so it fits a small instance. Get a free
      # key at openrouter.ai/keys and set it as OPENROUTER_API_KEY.
      # (OPENCODE_MODE=server — a second persistent `opencode serve` process
      # alongside this app — needs more RAM than this plan has; that's why
      # /api/chat used to 502.)
      - key: OPENCODE_MODE
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: inclusionai/ling-3.0-flash-vl:free
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # Manual-payment review: who can approve/reject at /admin/payments, and
      # (optional) who gets emailed the moment a member submits one.
      - key: ADMIN_EMAILS
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      # Gallery image storage: without these, saved dashboard entries archive
      # to the local disk, which this plan does not persist across deploys —
      # set all three from a free Cloudinary account so they survive one.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
