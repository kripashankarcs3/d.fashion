services:
  - type: web
    name: d-fashion-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      # Frontend origin (Vercel URL) allowed by CORS — set in dashboard.
      - key: CLIENT_ORIGIN
        sync: false
      # Secrets — set in the Render dashboard, never committed.
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: YOUCAM_API_KEY
        sync: false
      # OpenCode Zen powers the AI stylist chat, but free-tier bursts are
      # throttled server-side right now. In Docker the container runs its own
      # `opencode serve` (server mode) with the machine's auth — set
      # OPENCODE_AUTH_B64 (base64 of ~/.local/share/opencode/auth.json) and
      # OPENCODE_SERVER_PASSWORD in the dashboard alongside OPENCODE_API_KEY.
      # Set OPENCODE_MODE=server to use that local server.
      - key: OPENCODE_API_KEY
        sync: false
      - key: OPENCODE_MODE
        value: server
      - key: OPENCODE_MODEL
        value: big-pickle
      - key: OPENCODE_SERVER_PASSWORD
        sync: false
      - key: OPENCODE_AUTH_B64
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
