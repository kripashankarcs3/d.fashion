services:
  - type: web
    name: d-fashion-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      # Frontend origin (Vercel URL) allowed by CORS — set in dashboard.
      - key: CLIENT_ORIGIN
        sync: false
      # Secrets — set in the Render dashboard, never committed.
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: YOUCAM_API_KEY
        sync: false
      # OpenCode Zen powers the AI stylist chat. Set OPENCODE_API_KEY in the
      # dashboard (workspace needs billing); big-pickle is a free Zen model
      # served when the request carries an x-opencode-session header.
      - key: OPENCODE_API_KEY
        sync: false
      - key: OPENCODE_MODE
        value: zen
      - key: OPENCODE_MODEL
        value: big-pickle
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
